<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <!-- Arka Plan (Şeffaf olması için fill="none") -->
  <rect width="100%" height="100%" fill="none"/>
  
  <!-- Lojistik / Lowbed İkon Grubu -->
  <g transform="translate(10, 10)">
    <!-- Çekici Kabini ve Ağır Yük Görsel Simgesi -->
    <path d="M 20 70 L 40 25 L 75 25 L 90 45 L 90 70 Z" fill="#1e293b" />
    <path d="M 45 32 L 70 32 L 82 48 L 45 48 Z" fill="#0284c7" />
    <!-- Lowbed Dorse Çizgisi -->
    <path d="M 85 65 L 135 65 L 135 70 L 85 70 Z" fill="#f59e0b" />
    
    <!-- Tekerlekler -->
    <circle cx="35" cy="72" r="9" fill="#0f172a" />
    <circle cx="35" cy="72" r="4" fill="#94a3b8" />
    <circle cx="95" cy="72" r="7" fill="#0f172a" />
    <circle cx="95" cy="72" r="3" fill="#94a3b8" />
    <circle cx="112" cy="72" r="7" fill="#0f172a" />
    <circle cx="112" cy="72" r="3" fill="#94a3b8" />
    <circle cx="129" cy="72" r="7" fill="#0f172a" />
    <circle cx="129" cy="72" r="3" fill="#94a3b8" />
  </g>

  <!-- Tipografi / Şirket İsmi -->
  <text x="155" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#0f172a" letter-spacing="1">ATLAS</text>
  <text x="155" y="78" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#f59e0b" letter-spacing="2">HAFRİYAT &amp; NAKLİYAT</text>
  
  <!-- Alt Vurgu Çizgisi -->
  <rect x="155" y="86" width="220" height="3" rx="1.5" fill="#0284c7" />
</svg>
